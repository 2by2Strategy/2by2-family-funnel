<!doctype html>
<html lang="en">
<head>
<meta name="color-scheme" content="only light">
<meta name="darkreader-lock">
<meta charset="utf-8">
<script src="../track.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2by2 Academy – Counselor Questions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:only light;
  --p:#5640CE; --p2:#8F75EF; --ink:#16151A; --body:#5C5C66; --line:#DDD5F8; --soft:#F7F4FE;
  --bg:#FCFBFF; --deep:#231E3D; --track:#E6E0FB;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.display{font-family:'Anton','Arial Narrow',Impact,sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.01em}

/* top bar */
.top{display:flex;align-items:center;gap:28px;padding:28px 0 22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.top img.logo{height:58px;width:auto;display:block}
.sep{width:1px;align-self:stretch;background:var(--line)}
.proof{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.rating .row{display:flex;align-items:center;gap:8px}
.rating .num{font-weight:700;font-size:24px;color:var(--ink)}
.stars{display:flex;gap:3px}
.stars span{width:22px;height:22px;background:var(--p);color:#fff;display:grid;place-items:center;border-radius:3px;font-size:14px}
.rating .cap{font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--body);margin-top:4px;text-transform:uppercase}
.avatars{display:flex}
.avatars span{width:42px;height:42px;border-radius:50%;border:2px solid #fff;margin-left:-10px;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff;background:var(--p);background-size:cover;background-position:center;box-shadow:0 0 0 1px var(--line)}
.avatars span:first-child{margin-left:0}
.avatars span:nth-child(even){background-color:var(--p2)}
.vet .t1{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--p);text-transform:uppercase}
.vet .t2{font-size:13px;letter-spacing:.06em;color:var(--body);margin-top:4px;text-transform:uppercase}

/* hero */
.hero{margin-top:24px;position:relative;border-radius:22px;overflow:hidden;background:var(--deep);min-height:560px;display:flex;align-items:flex-end;isolation:isolate}
.hero .bgimg{position:absolute;inset:0;background-size:cover;background-position:center;z-index:-2}
.hero .shade{position:absolute;inset:0;z-index:-1;background:radial-gradient(700px 500px at 85% 10%,rgba(143,117,239,.55),rgba(143,117,239,0) 70%),linear-gradient(180deg,rgba(35,30,61,0) 30%,rgba(35,30,61,.85) 100%)}
.hero.has-img .bgimg{background-size:100% auto;background-position:top center;background-repeat:no-repeat;background-color:var(--deep)}
.hero.has-img .shade{background:linear-gradient(180deg,rgba(35,30,61,0) 0%,rgba(35,30,61,.1) 34%,rgba(35,30,61,.85) 58%,#231E3D 70%)}
.hero.has-img .dots{display:none}
@media (max-width:900px){.hero.has-img .bgimg{background-size:cover;background-position:12% 0;bottom:auto;height:300px}.hero.has-img .shade{background:linear-gradient(180deg,rgba(35,30,61,0) 0px,rgba(35,30,61,.6) 200px,#231E3D 300px)}.hero.has-img .hero-copy{padding-top:190px}}
.dots{position:absolute;inset:0;z-index:-1;background-image:radial-gradient(rgba(255,255,255,.18) 1px,transparent 1.5px);background-size:46px 46px;opacity:.6}
.hero-copy{padding:44px 44px 46px;max-width:880px}
.eyebrow{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.14em;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);padding:7px 12px;border-radius:999px;margin-bottom:18px}
.hero h1{margin:0;font-size:clamp(46px,6.2vw,86px);line-height:1.02;color:#fff}
.hero h1 .acc{color:var(--p2)}
.hero p.lead{color:rgba(255,255,255,.9);font-size:clamp(16px,1.6vw,19px);line-height:1.55;max-width:560px;margin:18px 0 0}

/* match card */
.match{position:absolute;right:44px;top:48px;width:min(400px,40%);background:#fff;border-radius:18px;padding:22px 22px 20px;box-shadow:0 30px 60px -20px rgba(10,6,30,.55);transform:rotate(-3deg)}
.match .bar{display:flex;gap:6px;align-items:center;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--body);margin-bottom:14px}
.match .bar i{width:8px;height:8px;border-radius:50%;background:var(--line);display:block}
.match .pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--p);background:var(--soft);padding:5px 10px;border-radius:999px}
.match h3{margin:10px 0 18px;font-size:30px;line-height:1;color:var(--p);font-style:italic}
.pair{display:flex;align-items:center;justify-content:space-between;gap:8px}
.who{text-align:center}
.who .av{width:62px;height:62px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;color:#fff;font-weight:700;border:3px solid #CFC3F7;background:var(--p)}
.who:last-child .av{background:var(--p2)}
.who small{font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--ink)}
.link{flex:1;height:0;border-top:2px dashed #BFB0F4;position:relative}
.link b{position:absolute;left:50%;top:-14px;transform:translateX(-50%);width:26px;height:26px;border-radius:50%;background:var(--p2);color:#fff;display:grid;place-items:center;font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.tags span{font-size:12px;font-weight:600;color:var(--p);background:var(--soft);border:1px solid var(--line);padding:5px 10px;border-radius:999px}

/* intro to quiz */
.go{text-align:center;padding:40px 0 10px}
.go h2{margin:0;font-size:clamp(20px,2.2vw,26px);font-weight:700;color:var(--ink);letter-spacing:-.01em}
.go a{display:inline-block;margin-top:12px;color:var(--p);font-size:26px;text-decoration:none;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(6px)}}

/* quiz */
.quiz{max-width:900px;margin:0 auto;padding:10px 24px 90px;min-height:92vh;scroll-margin-top:12px}
.prog{padding:14px 0 18px}
.prog .meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--body);margin-bottom:8px}
.prog .track{height:6px;border-radius:999px;background:var(--track);overflow:hidden}
.prog .fill{height:100%;width:0;background:var(--p);border-radius:999px;transition:width .35s ease}
.back{background:none;border:0;padding:0;font:inherit;color:var(--body);cursor:pointer;letter-spacing:.08em;text-transform:uppercase;font-size:12px;font-weight:600}
.back:hover{color:var(--p)}
.back[hidden]{visibility:hidden;display:inline}
.step{text-align:center;padding-top:26px;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.step h3{margin:0 auto;max-width:760px;font-size:clamp(32px,4.2vw,52px);line-height:1.12;color:var(--p);text-wrap:balance}
.step .sub{color:var(--body);font-size:17px;line-height:1.5;margin:14px auto 0;max-width:620px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:32px auto 0;max-width:760px}
.opts.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.opt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:128px;padding:20px 16px;background:#fff;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;font:inherit;font-size:16px;font-weight:500;color:var(--ink);text-align:center;line-height:1.35;transition:transform .12s ease,border-color .12s ease,background .12s ease}
.opt svg{width:30px;height:30px;stroke:var(--body);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.opt:hover{border-color:var(--p);transform:translateY(-3px)}
.opt.on{border-color:var(--p);background:var(--soft);box-shadow:0 0 0 1px var(--p) inset}
.opt.on svg{stroke:var(--p)}
.opt:focus-visible,.num:focus-visible,.cta:focus-visible,.field:focus-visible{outline:2px solid var(--p);outline-offset:3px}
.scale{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:34px auto 0;max-width:760px}
.num{width:58px;height:74px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-family:'Anton',Impact,sans-serif;font-size:28px;color:var(--p);cursor:pointer;transition:transform .12s ease,border-color .12s}
.num:hover{transform:translateY(-4px);border-color:var(--p)}
.num.on{background:var(--p);color:#fff;border-color:var(--p)}
.ends{display:flex;justify-content:space-between;max-width:700px;margin:12px auto 0;font-size:13px;color:var(--body);font-weight:500}
.fields{display:grid;gap:14px;max-width:560px;margin:30px auto 0;text-align:left}
.fields .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fields label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:6px}
.field{width:100%;font:inherit;font-size:17px;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:15px 16px;outline:none}
.field:focus{border-color:var(--p)}
.field::placeholder{color:#9CA1AD}
textarea.field{min-height:150px;resize:vertical;line-height:1.5}
.phone{display:flex;gap:8px}
.phone select{width:118px;flex:none;padding-left:12px;padding-right:8px}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;line-height:1.5;color:var(--body)}
.consent input{margin-top:3px;width:18px;height:18px;accent-color:var(--p);flex:none}
.err{color:#B42318;font-size:14px;margin-top:14px;min-height:20px}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:10px;margin-top:22px;min-width:280px;padding:18px 34px;border:0;border-radius:999px;background:var(--p);color:#fff;font:inherit;font-size:18px;font-weight:600;cursor:pointer;text-decoration:none;transition:transform .12s ease,background .12s}
.cta:hover{transform:translateY(-2px);filter:brightness(.94)}
.hint{font-size:12px;color:var(--body);margin-top:10px}
.done-list{list-style:none;padding:0;margin:30px auto 0;max-width:560px;text-align:left;display:grid;gap:12px}
.done-list li{display:flex;gap:14px;align-items:flex-start;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:16px 18px;font-size:15.5px;line-height:1.5;color:var(--ink)}
.done-list b.n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--p);display:grid;place-items:center;font-size:13px}
footer{border-top:1px solid var(--line);padding:26px 0 40px;font-size:13px;color:var(--body);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

@media (max-width:900px){
  .match{position:relative;right:auto;top:auto;width:auto;max-width:380px;margin:28px auto 0;transform:rotate(-2deg)}
  .hero{flex-direction:column;align-items:stretch;min-height:0}
  .hero-copy{padding:30px 24px 32px;max-width:none}
}
@media (max-width:640px){
  .wrap{padding:0 16px}
  .top{gap:16px;padding:20px 0 16px}
  .top img.logo{height:46px}
  .sep{display:none}
  .opts,.opts.three{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .opt{min-height:112px;font-size:15px;padding:16px 10px}
  .num{width:calc(20% - 8px);height:62px;font-size:24px}
  .fields .two{grid-template-columns:1fr}
  .cta{width:100%;min-width:0}
  .quiz{padding:6px 16px 70px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

.qtop{position:relative;text-align:center;padding:26px 24px 0}
.qtop img{height:64px;width:auto;display:inline-block}
.qtop .back{position:absolute;left:24px;top:34px}
.dotsbar{display:flex;align-items:center;justify-content:center;max-width:560px;margin:22px auto 0;padding:0 24px}
.dotsbar i{width:16px;height:16px;border-radius:50%;background:#D5CBF6;flex:none;transition:background .25s}
.dotsbar b{height:2px;flex:1;background:#D5CBF6;transition:background .25s}
.dotsbar i.on,.dotsbar b.on{background:var(--p)}
.quiz{min-height:auto;padding-top:0;flex:1;width:100%}
body{min-height:100vh;display:flex;flex-direction:column}
body>.wrap{width:100%}
@media (max-width:640px){.qtop img{height:50px}.qtop .back{left:16px;top:28px}.dotsbar{padding:0 16px}.dotsbar i{width:12px;height:12px}}

.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:rgba(35,30,61,.45);backdrop-filter:blur(3px);animation:in .2s ease}
.modal .box{background:#fff;border-radius:18px;max-width:480px;width:100%;padding:32px 28px 26px;text-align:center;box-shadow:0 30px 60px -20px rgba(10,6,30,.45)}
.modal .ico{width:56px;height:56px;border-radius:50%;background:var(--soft);display:grid;place-items:center;margin:0 auto 16px}
.modal .ico svg{width:28px;height:28px;stroke:var(--p);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.modal h4{margin:0;font-size:30px;line-height:1.1;color:var(--p)}
.modal p{margin:12px 0 0;color:var(--body);font-size:16px;line-height:1.55}
.modal .cta{width:100%;min-width:0;margin-top:22px}
.modal .later{display:block;width:100%;margin-top:10px;background:none;border:0;font:inherit;font-size:15px;color:var(--body);cursor:pointer;padding:10px}
.modal .later:hover{color:var(--p)}
.fields .opt-l{font-weight:500;color:var(--body)}
.opts.three .opt{min-height:112px}
@media (min-width:641px){.opts.three.five{grid-template-columns:repeat(6,minmax(0,1fr))}.opts.three.five .opt{grid-column:span 2}.opts.three.five .opt:nth-child(4){grid-column:2/span 2}}
@media (max-width:640px){.opts.five .opt:last-child{grid-column:1/-1}}
.nf-ico{width:64px;height:64px;border-radius:50%;background:var(--soft);border:1px solid var(--line);display:grid;place-items:center;margin:0 auto 20px}
.nf-ico svg,.nf-ok svg{width:30px;height:30px;stroke:var(--p);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nf-card{max-width:600px;margin:32px auto 0;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:24px 24px 20px;text-align:left;box-shadow:0 10px 30px rgba(86,64,206,.08)}
.nf-card h4{margin:0;font-size:28px;line-height:1.05;color:var(--p)}
.nf-card p{margin:8px 0 0;font-size:15.5px;line-height:1.55;color:var(--body)}
.nf-row{display:flex;gap:10px;margin-top:16px}.nf-row .field{flex:1;min-width:0}.nf-row .cta{margin-top:0;min-width:0;padding:15px 24px;font-size:16px;white-space:nowrap}
.nf-card .err{text-align:left;margin-top:8px;min-height:0}.nf-fine{font-size:12.5px;color:var(--body);margin-top:6px}
.nf-ok{display:flex;gap:14px;align-items:flex-start}.nf-ok svg{flex:none;margin-top:2px}
.nf-links{margin-top:22px;font-size:15px}.nf-links a{color:var(--p);font-weight:600;text-decoration:none}.nf-links a:hover{text-decoration:underline}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:640px){.nf-row{flex-direction:column}.nf-row .cta{width:100%}.nf-card{padding:20px 18px 18px}}
body::before{content:"";position:fixed;inset:0;z-index:-10;pointer-events:none;background-image:radial-gradient(900px 600px at 100% 0%,rgba(204,190,245,.8),rgba(204,190,245,0) 70%),radial-gradient(700px 520px at 0% 100%,rgba(204,190,245,.45),rgba(204,190,245,0) 70%)}
footer a{color:inherit;text-decoration:underline;text-underline-offset:2px}
.consent a{color:var(--p);text-decoration:underline}
.fields label.consent,.consent span{font-weight:400!important;font-size:12.5px;color:var(--body)}
</style>
</head>

  document.getElementById('back').style.visibility=(idx===0||s.type==='done')?'hidden':'visible';
}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

function render(focus){
  var s=STEPS[idx], h='';
  setProgress();
  if(s.type==='done'){ renderDone(); return; }
  h+='<div class="step"><h3 class="display">'+s.title()+'</h3>';
  if(s.sub) h+='<p class="sub">'+s.sub()+'</p>';
  if(s.type==='single'||s.type==='multi'){
    var cur=A[s.id]||(s.type==='multi'?[]:null);
    h+='<div class="opts'+(s.cols===3?' three':'')+(s.opts.length===5?' five':'')+'" role="'+(s.type==='multi'?'group':'radiogroup')+'">';
    s.opts.forEach(function(o){
      var on = s.type==='multi'? cur.indexOf(o[0])>-1 : cur===o[0];
      h+='<button type="button" class="opt'+(on?' on':'')+'" data-v="'+o[0]+'" aria-pressed="'+on+'">'+ic(o[2])+'<span>'+o[1]+'</span></button>';
    });
    h+='</div>';
    if(s.other){ var oo=cur===s.other, sh=oo?'':' style="display:none"';
      h+='<div class="fields" id="ob"'+sh+'><div><label for="ot">Where did you hear about us?</label><input class="field" id="ot" placeholder="Type your answer here…" value="'+esc(A[s.id+'Other']||'')+'"></div></div>'+
         '<div class="err" id="err"></div><button class="cta" id="next" type="button"'+sh+'>Continue &rarr;</button>'; }
    if(s.type==='multi') h+='<div class="err" id="err"></div><button class="cta" id="next" type="button">Continue &rarr;</button>';
  }
  if(s.type==='scale'){
    h+='<div class="scale">';
    for(var n=1;n<=10;n++) h+='<button type="button" class="num'+(A[s.id]===n?' on':'')+'" data-n="'+n+'" aria-label="'+n+' out of 10">'+n+'</button>';
    h+='</div><div class="ends"><span>'+s.ends[0]+'</span><span>'+s.ends[1]+'</span></div>';
  }
  if(s.type==='name'){
    h+='<div class="fields"><div class="two"><div><label for="fn">First name</label><input class="field" id="fn" autocomplete="given-name" placeholder="First name" value="'+esc(A.firstName||'')+'"></div>'+
       '<div><label for="ln">Last name</label><input class="field" id="ln" autocomplete="family-name" placeholder="Last name" value="'+esc(A.lastName||'')+'"></div></div>'+
       '<div><label for="bn">'+(isFirm()?'Firm name':'Business name')+'</label><input class="field" id="bn" autocomplete="organization" placeholder="'+(isFirm()?'Your firm’s name':'Your practice’s name')+'" value="'+esc(A.business||'')+'"></div></div>'+
       '<div class="err" id="err"></div><button class="cta" id="next" type="button">OK &rarr;</button><div class="hint">press <b>Enter &crarr;</b></div>';
  }
  if(s.type==='text'){
    h+='<div class="fields"><textarea class="field" id="tx" placeholder="Type your answer here…">'+esc(A.describe||'')+'</textarea></div>'+
       '<div class="err" id="err"></div><button class="cta" id="next" type="button">Continue &rarr;</button>';
  }
  if(s.type==='contact'){
    h+='<div class="fields">'+
      '<div><label for="em">Your work email</label><input class="field" id="em" type="email" autocomplete="email" placeholder="name@yourpractice.com" value="'+esc(A.email||'')+'"></div>'+
      '<div><label for="ph">Your preferred phone number</label><div class="phone"><select class="field" id="cc" aria-label="Country code"><option value="+1">US +1</option><option value="+1">CA +1</option><option value="+44">UK +44</option><option value="+86">CN +86</option><option value="+82">KR +82</option><option value="+91">IN +91</option><option value="+852">HK +852</option><option value="+65">SG +65</option></select>'+
      '<input class="field" id="ph" type="tel" autocomplete="tel-national" placeholder="(201) 555-0123" value="'+esc(A.phone||'')+'"></div></div>'+
      '<div><label for="ws">'+(isFirm()?'Your firm’s website':'Your website')+' <span class="opt-l">(optional)</span></label><input class="field" id="ws" type="url" autocomplete="url" inputmode="url" placeholder="yourpractice.com" value="'+esc(A.website||'')+'"></div>'+
      '<label class="consent"><input type="checkbox" id="ok"'+(A.consent?' checked':'')+'><span>I agree to receive text messages from 2by2 Academy (2by2 Strategy LLC) about my inquiry, including replies to my questions, call scheduling and reminders. Message frequency varies. Msg &amp; data rates may apply. Reply STOP to opt out, HELP for help. Consent is not a condition of any purchase. Texts are sent to US mobile numbers only. <a href="../privacy.html" target="_blank" rel="noopener">Privacy Policy</a> &middot; <a href="../terms.html" target="_blank" rel="noopener">Terms</a></span></label>'+
      '</div><div class="err" id="err"></div><button class="cta" id="next" type="button">Book my fit call &rarr;</button>';
  }
  h+='</div>';
  stage.innerHTML=h;
  bind(s);
  if(focus){ var f=stage.querySelector('input,textarea,.opt,.num'); if(f && (s.type==='name'||s.type==='text'||s.type==='contact')) f.focus({preventScroll:true}); }
}

function go(n){ hist.push(idx); idx=n; render(true); scrollQuiz(); }
/* ---------- NOT A FIT: answers that end the questionnaire right away ----------
   Edit these rules to change who gets screened out. Each returns a reason code (or '' to keep going). */
function notAFit(id){
  if(id==='role' && (A.role==='other'||A.role==='school-only')) return 'role';                       // not a counselor yet / school-only
  if(id==='background' && A.background && A.background.length===1 && A.background[0]==='newer') return 'experience'; // only "Under 5 years"
  if(id==='capacity' && A.capacity>=10) return 'capacity';                                          // fully booked
  if(id==='start' && A.start==='exploring') return 'timing';                                        // just exploring
  if(id==='invest' && A.invest==='no') return 'invest';                                             // can't invest $3K
  return '';
}
var NOT_FIT_LINE = {
  role:'2by2 matches families with independent counselors who take on private clients, so the network isn&rsquo;t set up for you just yet.',
  experience:'Right now we&rsquo;re adding counselors with more years of experience behind them. Families come to us for that, so we keep the bar high.',
  capacity:'Sounds like your calendar is full. That&rsquo;s a good problem to have. We match families with counselors who have room to take them on.',
  timing:'We&rsquo;re onboarding counselors who are ready to start working with new families soon, so the timing may not be right yet.',
  invest:'Joining the network takes an upfront investment in your practice, so now may not be the right time.'
};
var KILLED = '';
function next(){ var r=notAFit(STEPS[idx].id); if(r){ kill(r); return; } go(idx+1); }
function scrollQuiz(){ window.scrollTo({top:0,behavior:'smooth'}); }
function err(m){ var e=document.getElementById('err'); if(e) e.textContent=m||''; }

function bind(s){
  if(s.type==='single'){
    stage.querySelectorAll('.opt').forEach(function(b){ b.onclick=function(){
      A[s.id]=b.dataset.v; stage.querySelectorAll('.opt').forEach(function(x){x.classList.toggle('on',x===b);x.setAttribute('aria-pressed',x===b)});
      track('answer',{q:s.id});
      if(s.id==='role' && b.dataset.v==='school'){ fitNotice(); return; }
      if(s.other){ var show=b.dataset.v===s.other; document.getElementById('ob').style.display=show?'':'none'; document.getElementById('next').style.display=show?'':'none'; err('');
        if(show){ document.getElementById('ot').focus(); return; } A[s.id+'Other']=''; }
      setTimeout(next,220);
    };});
    if(s.other){ var goO=function(){ var t=val('ot'); if(!t) return err('Please tell us where you heard about us.'); A[s.id+'Other']=t; next(); };
      document.getElementById('next').onclick=goO; enter(goO); }
  }
  if(s.type==='multi'){
    A[s.id]=A[s.id]||[];
    stage.querySelectorAll('.opt').forEach(function(b){ b.onclick=function(){
      var v=b.dataset.v, arr=A[s.id], i=arr.indexOf(v);
      if(i>-1) arr.splice(i,1); else arr.push(v);
      b.classList.toggle('on',i<0); b.setAttribute('aria-pressed',i<0); err('');
    };});
    document.getElementById('next').onclick=function(){ if(!A[s.id].length) return err('Pick at least one.'); track('answer',{q:s.id}); next(); };
  }
  if(s.type==='scale'){
    stage.querySelectorAll('.num').forEach(function(b){ b.onclick=function(){
      A[s.id]=+b.dataset.n; stage.querySelectorAll('.num').forEach(function(x){x.classList.toggle('on',x===b)}); track('answer',{q:s.id}); setTimeout(next,220);
    };});
  }
  if(s.type==='name'){
    var go1=function(){ var f=val('fn'), l=val('ln'), bz=val('bn'); if(!f) return err('Please add your first name.'); if(!bz) return err(isFirm()?'Please add your firm’s name.':'Please add your business name.'); A.firstName=f; A.lastName=l; A.business=bz; next(); };
    document.getElementById('next').onclick=go1; enter(go1);
  }
  if(s.type==='text'){
    var tx=document.getElementById('tx'), nb=document.getElementById('next');
    tx.oninput=function(){ err(''); };
    nb.onclick=function(){ var t=tx.value.trim(); if(!t) return err(isFirm()?'Please tell us about your firm.':'Please tell us about your business.'); A.describe=t; next(); };
  }
  if(s.type==='contact'){
    var cc=document.getElementById('cc'); if(A.cc) cc.value=A.cc;
    document.getElementById('em').onblur=function(){ var e=val('em'); if(okEmail(e)){ A.email=e; send('partial'); } };
    var go2=function(){
      var e=val('em'), p=val('ph').replace(/[^\d+]/g,'');
      if(!okEmail(e)) return err('Please enter a valid email.');
      if(p.replace(/\D/g,'').length<7) return err('Please enter a valid phone number.');
      A.email=e; A.phone=val('ph'); A.cc=cc.value; A.website=val('ws'); A.consent=document.getElementById('ok').checked;
      send('complete'); track('Lead'); next();
    };
    document.getElementById('next').onclick=go2; enter(go2);
  }
}

function fitNotice(){
  var m=document.createElement('div'); m.className='modal'; m.setAttribute('role','dialog'); m.setAttribute('aria-modal','true'); m.setAttribute('aria-labelledby','fnT');
  m.innerHTML='<div class="box"><div class="ico">'+ic('school')+'</div>'+
    '<h4 class="display" id="fnT">Do you take private clients?</h4>'+
    '<p>2by2 matches families with independent counselors who take on private clients. If you counsel students privately outside your school role, you&rsquo;re welcome to keep going.</p>'+
    '<button class="cta" type="button" id="fnGo">Yes, I do &rarr;</button>'+
    '<button class="later" type="button" id="fnNo">No, only at my school</button></div>';
  document.body.appendChild(m);
  var close=function(){ m.remove(); document.removeEventListener('keydown',esc1); };
  var esc1=function(e){ if(e.key==='Escape'){ close(); A.role=null; render(false); } };
  document.addEventListener('keydown',esc1);
  document.getElementById('fnGo').focus();
  document.getElementById('fnGo').onclick=function(){ close(); A.role='school-private'; next(); };
  document.getElementById('fnNo').onclick=function(){ close(); A.role='school-only'; next(); };
}
function val(id){ var el=document.getElementById(id); return el?el.value.trim():''; }
function okEmail(e){ return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e); }
function enter(fn){ stage.querySelectorAll('input').forEach(function(i){ i.onkeydown=function(e){ if(e.key==='Enter'){e.preventDefault();fn();} }; }); }

function bookingLink(){
  if(!BOOKING_URL) return '#';
  var u=new URL(BOOKING_URL, location.href), q=u.searchParams;
  q.set('first_name',A.firstName||''); q.set('last_name',A.lastName||''); q.set('email',A.email||''); q.set('phone',(A.cc||'')+(A.phone||''));
  return u.toString();
}
function kill(reason){
  KILLED=reason; A.notFit=reason;
  var dots=document.getElementById('dots'); if(dots) dots.style.visibility='hidden';
  document.getElementById('back').style.visibility='hidden';
  send('disqualified'); try{ if(window.tt) tt('CounselorNotAFit',{reason:reason}); }catch(e){}
  stage.innerHTML='<div class="step nf"><div class="nf-ico">'+ic('match')+'</div>'+
    '<h3 class="display">This might not be the right fit yet</h3>'+
    '<p class="sub">'+(A.firstName?'Thanks for your interest, '+esc(A.firstName)+'. ':'Thanks for your interest in 2by2. ')+NOT_FIT_LINE[reason]+'</p>'+
    '<div class="nf-card" id="nfCard"><h4 class="display">Stay in the loop</h4>'+
      '<p>Join the 2by2 counselor email list. We&rsquo;ll share what we&rsquo;re seeing from families this admissions season, and let you know when the timing&rsquo;s right to join the network.</p>'+
      '<div class="nf-row"><label class="sr" for="nfEm">Email</label><input class="field" id="nfEm" type="email" autocomplete="email" placeholder="name@yourpractice.com" value="'+esc(A.email||'')+'">'+
      '<button class="cta" type="button" id="nfGo">Join the list &rarr;</button></div>'+
      '<div class="err" id="err"></div><div class="nf-fine">No spam. Unsubscribe anytime.</div></div>'+
    '<div class="nf-links"><a href="../">Visit 2by2 Academy &rarr;</a></div></div>';
  scrollQuiz();
  var join=function(){ var e=val('nfEm'); if(!okEmail(e)) return err('Please enter a valid email.'); A.email=e; A.emailList=true; send('waitlist');
    try{ if(window.tt) tt('CounselorEmailList',{reason:reason}); }catch(x){}
    document.getElementById('nfCard').innerHTML='<div class="nf-ok">'+ic('check')+'<div><h4 class="display">You&rsquo;re on the list</h4><p>Thanks'+(A.firstName?', '+esc(A.firstName):'')+'. Watch your inbox for '+esc(e)+'.</p></div></div>'; };
  document.getElementById('nfGo').onclick=join; enter(join);
}
function renderDone(){
  var list='<ul class="done-list">'+
      '<li><b class="n">1</b><span>We review your answers and your practice before we talk.</span></li>'+
      '<li><b class="n">2</b><span>On the call, we walk you through how matching works: who the families are, how we brief you and how we stay involved.</span></li>'+
      '<li><b class="n">3</b><span>If it&rsquo;s a fit on both sides, we set you up in the network and start matching.</span></li>'+
    '</ul>';
  if(BOOKING_URL){
    stage.innerHTML='<div class="step"><h3 class="display">You’re all set, '+esc(A.firstName||'')+'.</h3>'+
      '<p class="sub">Pick a time for your free 30-minute fit call. No hard sell. We&rsquo;re selective on both sides, so the call is about whether this is right for '+you()+'.</p>'+
      '<a class="cta" id="book" href="'+bookingLink()+'" target="_blank" rel="noopener">Choose a time &rarr;</a>'+list+'</div>';
    document.getElementById('book').onclick=function(){ track('Schedule'); send('book'); };
  } else {
    stage.innerHTML='<div class="step"><h3 class="display">Thanks, '+esc(A.firstName||'')+'. We’ve got it.</h3>'+
      '<p class="sub">We&rsquo;ll email you within one business day to set up your free 30-minute fit call. No hard sell. We&rsquo;re selective on both sides, so the call is about whether this is right for '+you()+'.</p>'+list+'</div>';
  }
}

/* tracking + lead capture (counselor events are kept separate from family Lead/Schedule so family ad optimization isn't polluted) */
var UTM={}; (function(){ var a=window.TWOBY2_ATTR||{}; for(var k in a) UTM[k]=a[k]; var p=new URLSearchParams(location.search); ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','fbclid','gclid'].forEach(function(k){ if(p.get(k)) UTM[k]=p.get(k); }); })();
function track(ev,data){ try{ if(!window.tt) return; if(ev==='Lead') tt('CounselorLead',{content_name:'counselor quiz'}); else if(ev==='Schedule') tt('CounselorBookingClick'); else tt('CounselorQuizStep',{step:(data&&data.q)||''}); }catch(e){} }
var SID=(function(){ try{ return (crypto.randomUUID&&crypto.randomUUID())||String(Date.now())+Math.random().toString(36).slice(2); }catch(e){ return String(Date.now())+Math.random().toString(36).slice(2); } })();
function optLabel(id,v){ var s=STEPS.filter(function(x){return x.id===id})[0]; if(!s||!s.opts) return v==null?'':String(v);
  var vals=Array.isArray(v)?v:(v==null?[]:[v]); return vals.map(function(x){ var o=s.opts.filter(function(p){return p[0]===x})[0]; return o?o[1]:x; }).join(', '); }
function roleLabel(){ return {solo:'Independent counselor (solo)',firm:'Firm owner','school-private':'School counselor, takes private clients','school-only':'School counselor only',other:'Not a counselor yet'}[A.role]||''; }
function flat(){ // readable, flat copy of the answers for GoHighLevel custom fields
  return {first_name:A.firstName||'', last_name:A.lastName||'', business_name:A.business||'', email:A.email||'', phone:A.phone?((A.cc||'+1')+String(A.phone).replace(/\D/g,'')):'', website:A.website||'',
    counselor_type:roleLabel(), calendar_fullness:A.capacity!=null?String(A.capacity):'', background:optLabel('background',A.background),
    families_per_year:optLabel('families',A.families), package_price:optLabel('price',A.price), lead_sources:optLabel('sources',A.sources),
    biggest_need:optLabel('want',A.want), start_timeline:optLabel('start',A.start), can_invest_3k:optLabel('invest',A.invest), about_business:A.describe||'', found_us:A.found==='other'?('Other: '+(A.foundOther||'')):optLabel('found',A.found), sms_consent:A.consent?'Yes':'No',
    utm_source:UTM.utm_source||'', utm_medium:UTM.utm_medium||'', utm_campaign:UTM.utm_campaign||'', utm_content:UTM.utm_content||'', utm_term:UTM.utm_term||'',
    fbclid:UTM.fbclid||'', gclid:UTM.gclid||'', ad_click_id:UTM.fbclid?('fbclid: '+UTM.fbclid):(UTM.gclid?('gclid: '+UTM.gclid):''), landing_page:UTM.landing_page||'', referrer:UTM.referrer||'', first_seen:UTM.first_seen||'',
    not_a_fit:A.notFit||'', email_list:A.emailList?'Yes':'No',
    lead_type:'Counselor'}; }
function send(stage){
  var payload={stage:stage, sid:SID, answers:A, f:flat(), utm:UTM, page:location.href, ts:new Date().toISOString(), source:'2by2-counselor-funnel'};
  if(SHEET_URL){ try{ fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({type:'counselor'},payload)),keepalive:true}); }catch(e){} }
  if(WEBHOOK_URL && stage!=='book'){ try{ fetch(WEBHOOK_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),keepalive:true}); }catch(e){} }
}



document.getElementById('back').onclick=function(){ if(hist.length){ idx=hist.pop(); render(true); scrollQuiz(); } };
render(false);
</script>
